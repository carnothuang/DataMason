<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favico.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f5f6f8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e0e0e"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="DataMason" />
    <link rel="manifest" href="/manifest.json" />
    <title>DataMason 数据瓦匠</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f5f6f8;
      }
      #root {
        min-height: 100%;
        min-height: 100dvh;
      }
      #DataMason-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        margin: 0;
        background: #f5f6f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans SC", sans-serif;
        color: #8b8fa3;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0e0e0e;
        }
        #DataMason-boot {
          background: #0e0e0e;
          color: rgba(255, 255, 255, 0.55);
        }
      }
      #DataMason-boot-mark {
        position: relative;
        width: 88px;
        height: 88px;
        flex: none;
      }
      #DataMason-boot-ring {
        box-sizing: border-box;
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(76, 84, 94, 0.18);
        border-top-color: #4c545e;
        animation: DataMason-boot-spin 0.85s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        #DataMason-boot-ring {
          border-color: rgba(167, 176, 185, 0.22);
          border-top-color: #a7b0b9;
        }
      }
      #DataMason-boot-logo {
        position: absolute;
        inset: 14px;
        width: 60px;
        height: 60px;
        border-radius: 14px;
        object-fit: contain;
        display: block;
        animation: DataMason-boot-breathe 1.6s ease-in-out infinite;
      }
      #DataMason-boot-text {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.04em;
        user-select: none;
      }
      @keyframes DataMason-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes DataMason-boot-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.94);
          opacity: 0.88;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #DataMason-boot-ring,
        #DataMason-boot-logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="DataMason-boot" role="status" aria-live="polite">
        <div id="DataMason-boot-mark" aria-hidden="true">
          <div id="DataMason-boot-ring"></div>
          <img
            id="DataMason-boot-logo"
            src="/logo.svg"
            alt=""
            width="60"
            height="60"
          />
        </div>
        <div id="DataMason-boot-text">Loading…</div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("DataMason-boot-text");
        if (!el) return;
        try {
          var lang = (
            navigator.language ||
            navigator.userLanguage ||
            ""
          ).toLowerCase();
          if (lang.indexOf("zh") === 0) el.textContent = "加载中…";
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
